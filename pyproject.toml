[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rogue-blender-mcp"
version = "1.0.1"
description = "Rogue Development MCP server for Blender — modeling, sculpting, and scene control"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Rogue Development" }
]
keywords = ["mcp", "blender", "3d", "sculpting", "modeling", "rogue"]
dependencies = []

[project.scripts]
rogue-blender-mcp = "rogue_blender_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/rogue-dev-studio/rogue-blender-mcp"
Repository = "https://github.com/rogue-dev-studio/rogue-blender-mcp"
Issues = "https://github.com/rogue-dev-studio/rogue-blender-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rogue_blender_mcp"]
